[package]
name = "idlebot-godot-bridge"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "idlebot-godot-bridge"
path = "src/main.rs"

[workspace]
[dependencies]
tokio = { version = "1", features = ["full", "macros"] }
tokio-tungstenite = "0.23"
spacetimedb-sdk = { version = "2.14" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
futures-util = "0.3"
