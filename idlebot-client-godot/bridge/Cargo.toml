[package]
name = "idlebot-godot-bridge"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "idlebot-godot-bridge"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full", "macros"] }
tokio-tungstenite = "0.23"
spacetimedb-client-api-messages = "2.14"
spacetimedb-sats = "2.14"
spacetimedb-lib = "2.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
