[package]
name = "virtual_joystick"
version = "2.8.0"
edition = "2024"
description = "Bevy virtual Joystick for mobile/web/touch games with Mouse Emulation (vendored, bevy 0.20)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/SergioRibera/virtual_joystick"

# Vendored at 2.8.0 (upstream main still targets bevy 0.19). Ported to bevy
# 0.20 locally; drop this fork if upstream releases a 0.20-compatible version.

[features]
default = ["serde"]
serde = ["dep:serde"]

[dependencies]
bevy = { workspace = true, features = [
 "bevy_render",
 "bevy_ui",
 "bevy_window",
] }
serde = { version = "1", features = ["derive"], optional = true }
variadics_please = "2"
