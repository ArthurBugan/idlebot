[package]
name = "idlecore-client"
version = "0.1.0"
edition = "2021"
default-run = "idlecore-client"

[dependencies]
idlecore-core = { path = "../idlecore-core" }
bevy = { workspace = true }
bevy_ecs = { version = "0.19", features = ["debug"] }
serde = { workspace = true }
serde_json = { workspace = true }
spacetimedb-sdk = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rand = { workspace = true }
image = "0.25"
web-sys = { version = "0.3", features = ["Window", "Storage", "Document", "Performance", "HtmlInputElement", "Event", "KeyboardEvent", "HtmlElement"] }

# On web, the SpacetimeDB SDK must use its browser (wasm) transport.
[target.'cfg(target_arch = "wasm32")'.dependencies]
spacetimedb-sdk = { version = "2.8", default-features = false, features = ["browser"] }
bevy = { workspace = true, features = ["webgl2"] }
getrandom = { version = "0.2", features = ["js"] }
wasm-bindgen-futures = "0.4"
wasm-bindgen = "0.2.127"
js-sys = "0.3"