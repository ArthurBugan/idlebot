server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve the wasm module with the correct MIME type so it executes.
    types {
        application/wasm wasm;
    }

    # SPA-style fallback: anything unknown falls through to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Disable caching of the wasm/JS glue during development; assets are
    # content-addressed by the client loader, so they can stay cached.
    location ~* \.(wasm|js)$ {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(png|jpg|jpeg|gif|glb|gltf|ttf|otf|json)$ {
        add_header Cache-Control "public, max-age=604800";
    }
}
