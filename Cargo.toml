[workspace]
members = [
    "crates/idlebot-core",
    "crates/idlebot-client",
    "crates/idlebot-server",
    "crates/idlebot-chain",
]
resolver = "2"

[workspace.dependencies]
bevy = "0.15"
serde = { version = "1", features = ["derive"] }
spacetimedb = "2.7"
alloy = { version = "2.0", features = ["full"] }
tokio = { version = "1", features = ["full"] }
rand = "0.8"
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
str0m = "0.21"
datachannel = "0.16"

[profile.release]
opt-level = 3
lto = true
