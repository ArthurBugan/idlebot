[workspace]
resolver = "2"
members = [
    "crates/idlecore-core",
    "crates/idlecore-server",
    "crates/idlecore-client",
    "crates/idlecore-chain",
]

[workspace.dependencies]
bevy = { version = "0.19", default-features = false, features = [
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_state",
    "bevy_winit",
    "bevy_window",
    "bevy_log",
    "bevy_text",
    "bevy_gilrs",
    "bevy_asset",
    "bevy_sprite",
    "bevy_pbr",
    "bevy_ui",
    "x11",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
spacetimedb = "2.7"
alloy = { version = "2.2", features = ["full"] }
chrono = "0.4"
rand = { version = "0.8", features = ["small_rng"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
str0m = "0.21"
datachannel = "0.3"
hex = "0.4"
