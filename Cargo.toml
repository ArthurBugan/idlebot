[workspace]
resolver = "2"
members = [
    "crates/idlecore-core",
    "crates/idlecore-server",
    "crates/idlecore-client",
    "crates/idlecore-chain",
]

[workspace.dependencies]
bevy = { version = "0.19", default-features = true }
bevy_rapier3d = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
spacetimedb = "2.7"
spacetimedb-sdk = "2.8"
alloy = { version = "2.2", features = ["full"] }
chrono = "0.4"
rand = { version = "0.8", features = ["small_rng"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
str0m = "0.21"
datachannel = "0.3"
hex = "0.4"
# Solana-compatible ed25519 (RFC 8032) + base58 — same key type the Anchor
# programs use for wallet Pubkeys (Spec 013 Solana-native auth).
ed25519-dalek = { version = "1", features = ["rand_core"] }
curve25519-dalek = "3"
base58 = "0.2"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.21"
# Server-client protocol (Spec 021): borsh wire format + lz4 compression.
borsh = { version = "1", features = ["derive"] }
lz4_flex = "0.11"

# ---------------------------------------------------------------------------
# Performance: `cargo run` builds in debug (opt-level 0) by default, and Bevy
# at opt-level 0 runs dramatically slower (render + batching + scheduling),
# which drags FPS to ~40 even with a light scene. Optimise every dependency
# (Bevy, ECS, etc.) at opt-level 3 while keeping the workspace's own crates at
# opt-level 1 for fast incremental iteration.
# ---------------------------------------------------------------------------
[profile.dev]
opt-level = 1
incremental = true

[profile.dev.package."*"]
opt-level = 3

