[workspace]
resolver = "2"
members = [
    "crates/idlecore-core",
    "crates/idlecore-server",
    "crates/idlecore-client",
    # "crates/idlecore-chain",  # excluded: alloy WASM compilation issues (non-critical)
]

[workspace.dependencies]
bevy = { git = "https://github.com/bevyengine/bevy", default-features = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
spacetimedb = "2.7"
alloy = { version = "2.2", features = ["full"] }
chrono = "0.4"
rand = { version = "0.8", features = ["small_rng"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
str0m = "0.21"
datachannel = "0.3"
hex = "0.4"
